
[package]
name = "rust-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

aws-config = "1"
aws-sdk-sqs = "1"
aws-sdk-s3 = "1.5"
thiserror = "2.0.21"
rig = "0.45.0"
async-trait = "0.1.92"
sqlx = { version = "0.9.0", features = ["runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "derive",
    "migrate"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
tracing = "0.1.44"
dotenvy = "0.15.7"
tracing-subscriber = "0.3.23"
qdrant-client = "1.15.0"
# Load dynamic is required for the qdrant client to work with the latest version of the qdrant serve
# fastembed = "=5.1.0"
rig-core = "=0.42.0"
rig-fastembed = "=0.42.0"