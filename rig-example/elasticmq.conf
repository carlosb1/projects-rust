
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
}

aws {
  region = eu-west-1
  accountId = 000000000000
}

queues {
  python-jobs {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 10 seconds
  }

  rust-jobs {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 10 seconds
  }
}
