[package]
name = "rig-vllm-example"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8.9", features=["multipart"] }
axum-macros = { version = "0.5.0-rc.1" }
tracing = "0.1.44"
serde_json = "1.0.151"
serde = "1.0.229"
tracing-subscriber = "0.3.23"
tower-http = { version = "0.6", features = ["cors", "fs"] }
dashmap = "6.2.1"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
aws-config = { version = "1.12", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.5"
aws-sdk-sqs = "1.114.0"
dotenvy = "0.15.7"
sqlx = { version = "0.9.0", features = ["runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "derive",
    "migrate"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.20"
async-trait = "0.1.92"
qdrant-client = "1.15.0"
# Load dynamic is required for the qdrant client to work with the latest version of the qdrant serve
fastembed = "=5.1.0"
