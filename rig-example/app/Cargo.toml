[package]
name = "rig-vllm-example"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
rig = "0.42"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8.9", features=["multipart"] }
tracing = "0.1.44"
serde_json = "1.0.151"
serde = "1.0.229"
tracing-subscriber = "0.3.23"
tower-http = { version = "0.6", features = ["cors", "fs"] }
dashmap = "6.2.1"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
aws-config = "1.12.0"
aws-sdk-sqs = "1.114.0"
